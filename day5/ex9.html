<!DOCTYPE html>
<html>
<head>
<title>Todo</title>
</head>
<body>

<ul>

<li class="high">Assignment</li>

<li class="done">Exercise</li>

<li>Shopping</li>

<li class="high">Project</li>

</ul>

<p id="pending">Pending : 4</p>

<button onclick="updateTask()">Update</button>

<script>

function updateTask(){

document.querySelectorAll(".high").forEach(function(x){

x.style.color="red";

});

document.querySelectorAll(".done").forEach(function(x){

x.style.color="green";

x.style.textDecoration="line-through";

});

document.getElementById("pending").innerHTML="Pending : 3";

}

</script>

</body>
</html>
