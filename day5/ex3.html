<!DOCTYPE html>
<html>
<head>
<title>Character Counter</title>
</head>
<body>

<textarea id="text" onkeyup="countChar()"></textarea>

<p id="count">Characters : 0</p>

<script>

function countChar(){

let total=document.getElementById("text").value.length;

document.getElementById("count").innerHTML="Characters : "+total;

if(total>100){

document.getElementById("count").style.color="red";
document.getElementById("text").style.border="2px solid red";

}
else{

document.getElementById("count").style.color="black";
document.getElementById("text").style.border="1px solid black";

}

}

</script>

</body>
</html>
