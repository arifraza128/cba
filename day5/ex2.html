<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
</head>
<body>

<img src="https://via.placeholder.com/150" width="150">

<h2 class="name">John</h2>

<h3 class="job">Web Developer</h3>

<button onclick="changeProfile()">Update Profile</button>

<script>

function changeProfile(){

    document.querySelector(".name").innerHTML="Arif Raza";
    document.querySelector(".job").innerHTML="Cloud Engineer";

    document.querySelector("img").src="https://via.placeholder.com/150/00ff00";

    document.body.style.backgroundColor="lightblue";

}

</script>

</body>
</html>
