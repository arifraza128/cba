<!DOCTYPE html>
<html>
<head>
<title>Pricing</title>
</head>
<body>

<div class="plan" onclick="selectPlan(this)">Basic</div>

<div class="plan" onclick="selectPlan(this)">Standard</div>

<div class="plan" onclick="selectPlan(this)">Premium</div>

<h2 id="selected"></h2>

<script>

function selectPlan(card){

let plans=document.querySelectorAll(".plan");

for(let p of plans){

p.style.background="white";

}

card.style.background="yellow";

document.getElementById("selected").innerHTML="Selected : "+card.innerHTML;

}

</script>

</body>
</html>
