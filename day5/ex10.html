<!DOCTYPE html>
<html>
<head>
<title>Employee</title>
</head>
<body>

<div class="emp">
<h2>Rahul</h2>
<p class="score">90</p>
<p class="status"></p>
</div>

<div class="emp">
<h2>John</h2>
<p class="score">70</p>
<p class="status"></p>
</div>

<div class="emp">
<h2>David</h2>
<p class="score">40</p>
<p class="status"></p>
</div>

<button onclick="evaluate()">Evaluate</button>

<script>

function evaluate(){

let emp=document.querySelectorAll(".emp");

emp.forEach(function(e){

let score=parseInt(e.querySelector(".score").innerHTML);

let status=e.querySelector(".status");

if(score>85){

status.innerHTML="Excellent";
e.style.background="lightgreen";

}
else if(score>=60){

status.innerHTML="Good";
e.style.background="orange";

}
else{

status.innerHTML="Needs Improvement";
e.style.background="pink";

}

});

}

</script>

</body>
</html>
