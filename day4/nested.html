<script>
  let students = [
    { name: "Alice", age: 20 },
    { name: "Bob", age: 22 },
    { name: "Charlie", age: 19 }
  ];
document.write("<h2>Student List</h2>");
document.write("<ul>");
document.write(students.map(student => `<li>Name: ${student.name}, Age: ${student.age}</li>`).join(""));
document.write("</ul>");
 
</script>
