<!DOCTYPE html>
<html>
  <head>
    <title>Async Examples</title>
  </head>
  <body>
   <script>
    function hello(name,callback){
      document.write("Welcome "+ name);
      document.write("<br>");
      callback();
    }
    function sayHello()
    {
      document.write("Say Hello!!");
      setTimeout(function (){
        document.write("runs after 2 second");
      },2000);
      document.write("end of function..");
    }
    hello("Krishna",sayHello);
   </script>
  </body>
</html>
