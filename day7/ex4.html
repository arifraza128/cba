<!DOCTYPE html>
<html>
<head>
    <title>Shopping Order</title>
</head>
<body>

<script>

function placeOrder(){
    return new Promise(function(resolve){
        setTimeout(function(){
            document.write("Order Placed<br>");
            resolve();
        },1000);
    });
}

function payment(){
    return new Promise(function(resolve,reject){
        let paymentSuccess = true;

        setTimeout(function(){

            if(paymentSuccess){
                document.write("Payment Successful<br>");
                resolve();
            }
            else{
                reject("Payment Failed");
            }

        },1000);
    });
}

function shipping(){
    return new Promise(function(resolve){
        setTimeout(function(){
            document.write("Product Shipped<br>");
            resolve();
        },1000);
    });
}

placeOrder()
.then(payment)
.then(shipping)
.then(function(){
    document.write("Order Completed");
})
.catch(function(error){
    document.write(error);
});

</script>

</body>
</html>
