<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>
</head>
<body>

<script>

fetch("https://jsonplaceholder.typicode.com/users")

.then(function(response){
    return response.json();
})

.then(function(data){

    data.forEach(function(user){

        document.write("<b>Name :</b> " + user.name + "<br>");
        document.write("<b>Email :</b> " + user.email + "<br>");
        document.write("<b>City :</b> " + user.address.city + "<br><br>");

    });

})

.catch(function(error){
    console.log(error);
});

</script>

</body>
</html>
