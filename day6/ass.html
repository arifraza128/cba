<!DOCTYPE HTML>
<html>
<head>
    <title>JavaScript Quiz</title>

    <style>

        body{
            font-family: Arial;
            width:600px;
            margin:auto;
            margin-top:30px;
        }

        #progress{
            width:100%;
            height:20px;
            background:#ddd;
            border-radius:10px;
            margin-bottom:20px;
        }

        #bar{
            width:0%;
            height:20px;
            background:green;
            border-radius:10px;
        }

        .option{
            border:1px solid gray;
            padding:10px;
            margin:10px 0;
            cursor:pointer;
        }

        .option:hover{
            background:lightgray;
        }

        button{
            padding:10px 20px;
            font-size:16px;
        }

    </style>

</head>

<body>

<h1>JavaScript Quiz</h1>

<div id="progress">
    <div id="bar"></div>
</div>

<h3 id="count"></h3>

<h2 id="question"></h2>

<div class="option" id="op1"></div>
<div class="option" id="op2"></div>
<div class="option" id="op3"></div>
<div class="option" id="op4"></div>

<br>

<button id="next">Next</button>

<h2 id="result"></h2>

<script>

let quiz=[

{
question:"Which keyword is used to declare a variable?",
options:["int","let","char","define"],
answer:"let"
},

{
question:"Which array method adds an element?",
options:["push()","pop()","shift()","slice()"],
answer:"push()"
},

{
question:"JavaScript is a ______ language.",
options:["Programming","Database","Markup","Styling"],
answer:"Programming"
},

{
question:"Which company developed JavaScript?",
options:["Google","Apple","Netscape","IBM"],
answer:"Netscape"
}

];

let index=0;
let score=0;
let selected="";

showQuestion();

function showQuestion(){

document.getElementById("count").innerHTML=
"Question "+(index+1)+" of "+quiz.length;

document.getElementById("question").innerHTML=
quiz[index].question;

document.getElementById("op1").innerHTML=quiz[index].options[0];
document.getElementById("op2").innerHTML=quiz[index].options[1];
document.getElementById("op3").innerHTML=quiz[index].options[2];
document.getElementById("op4").innerHTML=quiz[index].options[3];

document.getElementById("bar").style.width=
(index/quiz.length)*100+"%";

}

document.getElementById("op1").addEventListener("click",function(){
selected=this.innerHTML;
});

document.getElementById("op2").addEventListener("click",function(){
selected=this.innerHTML;
});

document.getElementById("op3").addEventListener("click",function(){
selected=this.innerHTML;
});

document.getElementById("op4").addEventListener("click",function(){
selected=this.innerHTML;
});

document.getElementById("next").addEventListener("click",function(){

if(selected==""){
alert("Select an option");
return;
}

if(selected==quiz[index].answer){
score++;
}

selected="";

index++;

if(index<quiz.length){

showQuestion();

}
else{

document.getElementById("bar").style.width="100%";

document.getElementById("question").innerHTML="";
document.getElementById("count").innerHTML="";
document.getElementById("op1").style.display="none";
document.getElementById("op2").style.display="none";
document.getElementById("op3").style.display="none";
document.getElementById("op4").style.display="none";
document.getElementById("next").style.display="none";

document.getElementById("result").innerHTML=
"Quiz Completed<br><br>Your Score : "+score+" / "+quiz.length;

}

});

</script>

</body>
</html>
